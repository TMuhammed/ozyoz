[package]
name = "ozyoz-input"
description = "System-wide keystroke interception and injection for Özyoz desktop (macOS, Windows, Linux/X11)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ozyoz-core = { path = "../ozyoz-core" }
ozyoz-typing = { path = "../ozyoz-typing" }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["record", "xtest", "xkb"] }
xkeysym = "0.2"
