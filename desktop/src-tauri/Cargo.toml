[package]
name = "ozyoz-desktop"
description = "Özyoz — system-wide conversion to the new Uzbek Latin alphabet while typing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ozyoz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
env_logger = "0.11"
ozyoz-core = { path = "../../crates/ozyoz-core" }
ozyoz-typing = { path = "../../crates/ozyoz-typing" }
ozyoz-input = { path = "../../crates/ozyoz-input" }
