[workspace]
resolver = "2"
members = ["crates/ozyoz-core", "crates/ozyoz-typing", "crates/ozyoz-input", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ozyoz/ozyoz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
